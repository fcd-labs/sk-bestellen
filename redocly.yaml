# Lint rules for the OpenAPI contracts (CI step 3). Base: the recommended rules of Redocly.
extends:
  - recommended
rules:
  # mvp0 has no user accounts: "Inloggen en autorisatie waar gebruikers zijn" has a proposed explain,
  # not yet approved by the product owner (issue in fcd-demo). Until then this rule is off.
  security-defined: off
  # GET /menu has no input, so there is no client error to describe: a warning, not an error.
  operation-4xx-response: warn
