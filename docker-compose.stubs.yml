# Stubs for kitchen, bar and cash register.
# Separate containers, NOT part of the Bestellen sub-product.
# They receive the order according to contracts/order.openapi.yaml.
# Host ports (localhost only) are there to see what each stub received.
# The project name (per showcase) is given by fcd: <prefix>-<sub-product>.

# Least privilege for every container.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  stub-kitchen:
    <<: *hardening
    build:
      context: ./stubs/kitchen
      args:
        APP_VERSION: ${STUB_KITCHEN_VERSION:?run via fcd (versions.env)}
    image: showkitchen/stub-kitchen:${STUB_KITCHEN_VERSION:?run via fcd (versions.env)}
    ports:
      - "127.0.0.1:${PORT_STUB_KITCHEN:?run via fcd (environment of the showcase)}:8080"

  stub-bar:
    <<: *hardening
    build:
      context: ./stubs/bar
      args:
        APP_VERSION: ${STUB_BAR_VERSION:?run via fcd (versions.env)}
    image: showkitchen/stub-bar:${STUB_BAR_VERSION:?run via fcd (versions.env)}
    ports:
      - "127.0.0.1:${PORT_STUB_BAR:?run via fcd (environment of the showcase)}:8080"

  stub-cash-register:
    <<: *hardening
    build:
      context: ./stubs/cash-register
      args:
        APP_VERSION: ${STUB_CASH_REGISTER_VERSION:?run via fcd (versions.env)}
    image: showkitchen/stub-cash-register:${STUB_CASH_REGISTER_VERSION:?run via fcd (versions.env)}
    ports:
      - "127.0.0.1:${PORT_STUB_CASH_REGISTER:?run via fcd (environment of the showcase)}:8080"
