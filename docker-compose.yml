# Sub-product Bestellen: the unit of deployment. Always deployed as a whole.
# Versions come from versions.env (the pipeline passes it with --env-file).
# The project name (per showcase) is given by fcd: <prefix>-<sub-product>.

# Least privilege for every container.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  bestellen-frontend:
    <<: *hardening
    build:
      context: ./bestellen/frontend
    image: showkitchen/bestellen-frontend:${BESTELLEN_FRONTEND_VERSION:?run via fcd (versions.env)}
    ports:
      - "127.0.0.1:${PORT_BESTELLEN:?run via fcd (environment of the showcase)}:8080"
    depends_on:
      - bestellen-backend

  bestellen-backend:
    <<: *hardening
    build:
      context: ./bestellen
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${BESTELLEN_BACKEND_VERSION:?run via fcd (versions.env)}
    image: showkitchen/bestellen-backend:${BESTELLEN_BACKEND_VERSION:?run via fcd (versions.env)}
    # No host port: only reachable inside the Docker network.
    environment:
      MENU_PATH: /app/menu/menu.yaml
      # Key result: every order is measured and sent to the Dashboard (fcd-demo) on this machine.
      DASHBOARD_EVENTS_URL: ${DASHBOARD_EVENTS_URL:?run via fcd (Dashboard of the showcase)}
      FCD_SHOWCASE: ${FCD_SHOWCASE:?run via fcd (showcase)}
      FCD_EXPERIMENT: ${FCD_EXPERIMENT:-mvp0}
      FCD_ENVIRONMENT: ${FCD_ENVIRONMENT:-lokaal}
      SUBPRODUCT_VERSION: ${SUBPRODUCT_VERSION:?run via fcd (versions.env)}
      BESTELLEN_FRONTEND_VERSION: ${BESTELLEN_FRONTEND_VERSION:?run via fcd (versions.env)}
      BESTELLEN_BACKEND_VERSION: ${BESTELLEN_BACKEND_VERSION:?run via fcd (versions.env)}
    extra_hosts:
      # Works with Docker Desktop, Rancher Desktop (dockerd), Colima and Linux.
      - "host.docker.internal:host-gateway"
