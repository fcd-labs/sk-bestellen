openapi: 3.1.0
info:
  title: Order contract
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Contract between the Bestellen sub-product (sender) and kitchen, bar and
    cash register (receivers). In mvp0 the receivers are stubs: separate
    containers, not part of the Bestellen sub-product.

    Bestellen sends one order, the whole order, directly to each receiver.
    Every receiver implements this same contract. No events.

    Receiving is idempotent: sending the same `orderId` again has the same
    result and does not create a second order.
servers:
  - url: /
    description: Each receiver (kitchen, bar, cash register) on its own host
tags:
  - name: orders
    description: Receive the whole order
paths:
  /orders:
    post:
      tags: [orders]
      operationId: receiveOrder
      summary: Receive a placed order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            example:
              orderId: 3f2b8c1e-6a4d-4e7b-9c0a-1d2e3f4a5b6c
              placedAt: '2026-11-15T19:42:00Z'
              tableNumber: 12
              currency: EUR
              lines:
                - menuItemId: tomato-soup
                  name: Tomatensoep
                  station: kitchen
                  quantity: 2
                  unitPriceCents: 650
                  lineTotalCents: 1300
                - menuItemId: draught-beer
                  name: Bier van de tap
                  station: bar
                  quantity: 2
                  unitPriceCents: 380
                  lineTotalCents: 760
              totalCents: 2060
      responses:
        '202':
          description: The order is received by this receiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
              example:
                orderId: 3f2b8c1e-6a4d-4e7b-9c0a-1d2e3f4a5b6c
                receiver: kitchen
                receivedAt: '2026-11-15T19:42:01Z'
        '400':
          description: The order does not conform to this contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Order:
      type: object
      additionalProperties: false
      required: [orderId, placedAt, tableNumber, currency, lines, totalCents]
      properties:
        orderId:
          description: Unique id of the order, generated by Bestellen.
          type: string
          format: uuid
        placedAt:
          description: Moment the guest placed the order (UTC).
          type: string
          format: date-time
        tableNumber:
          $ref: '#/components/schemas/TableNumber'
        currency:
          description: ISO 4217 currency code, taken from the menu.
          type: string
          const: EUR
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
        totalCents:
          description: Sum of all lineTotalCents.
          type: integer
          minimum: 0
    TableNumber:
      description: Number of the table the guest sits at, so receivers know who the order is for.
      type: integer
      minimum: 1
      maximum: 999
    OrderLine:
      type: object
      additionalProperties: false
      required: [menuItemId, name, station, quantity, unitPriceCents, lineTotalCents]
      properties:
        menuItemId:
          description: Id of the menu item, as in the menu (menu.schema.json).
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 64
        name:
          description: Name of the menu item at the moment of ordering.
          type: string
          minLength: 1
          maxLength: 100
        station:
          description: |
            Where the line is prepared, taken from the menu. Kitchen and bar
            receive the whole order and use this to see which lines are theirs.
          type: string
          enum: [kitchen, bar]
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unitPriceCents:
          description: Price per unit in cents, including VAT, at the moment of ordering.
          type: integer
          minimum: 0
        lineTotalCents:
          description: quantity × unitPriceCents.
          type: integer
          minimum: 0
    OrderReceipt:
      type: object
      additionalProperties: false
      required: [orderId, receiver, receivedAt]
      properties:
        orderId:
          type: string
          format: uuid
        receiver:
          description: Which receiver confirms receipt.
          type: string
          enum: [kitchen, bar, cash-register]
        receivedAt:
          type: string
          format: date-time
    Problem:
      description: Error details according to RFC 9457.
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
