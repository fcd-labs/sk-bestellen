# Runs as non-root (nginx-unprivileged image), listens on 8080.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. inlineCritical is off in angular.json, so no inline scripts are needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bestellen API: only the two routes of the contract are forwarded to the backend.
    location = /api/menu {
        limit_except GET { deny all; }
        proxy_pass http://bestellen-backend:8080/menu;
    }

    location = /api/orders {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://bestellen-backend:8080/orders;
    }

    location /api/ {
        return 404;
    }
}
